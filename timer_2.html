<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Timer</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root{
    --ink:#0E1116;
    --paper:#F4F6F8;
    --amber:#F2A93B;
    --mute:#8A94A3;
    --line:rgba(244,246,248,.16);
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}

  body{
    font-family:var(--ui);
    background:transparent;
    color:var(--paper);
    -webkit-font-smoothing:antialiased;
    user-select:none;
    cursor:default;
  }

  #stage{
    position:relative;
    height:100%;
    width:100%;
    transition:background-color .2s ease;
  }
  #stage.bg-veil{background:rgba(14,17,22,.55)}
  #stage.bg-solid{background:var(--ink)}

  /* the whole clock is one canvas, cleared and redrawn each frame */
  #cv{position:absolute;inset:0;display:block}

  /* ---------- controls: hidden until the mouse moves ---------- */

  #ui{
    position:absolute;
    inset:auto 0 0 0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:8px;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .18s ease,transform .18s ease;
    pointer-events:none;
  }
  #ui.show{opacity:1;transform:none;pointer-events:auto}

  button{
    font:inherit;
    font-size:12px;
    font-weight:600;
    color:var(--paper);
    background:rgba(14,17,22,.82);
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 11px;
    cursor:pointer;
    white-space:nowrap;
    transition:background-color .12s ease;
  }
  button:hover{background:rgba(38,44,54,.92)}
  button:active{background:rgba(58,66,80,.95)}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  button.pri{background:rgba(242,169,59,.92);color:#171208;border-color:transparent}
  button.pri:hover{background:rgba(247,182,84,.96)}

  /* ---------- settings panel ---------- */

  #panel{
    position:absolute;
    inset:0;
    background:rgba(14,17,22,.97);
    padding:14px;
    overflow-y:auto;
    display:none;
    font-size:12px;
  }
  #panel.show{display:block}
  #panel h2{
    font-size:10px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--mute);
    margin:0 0 7px;
  }
  .row{margin-bottom:14px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{
    font-size:11px;
    font-weight:600;
    padding:5px 9px;
    border-radius:5px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--mute);
    cursor:pointer;
  }
  .chip:hover{color:var(--paper);border-color:rgba(244,246,248,.35)}
  .chip[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:transparent}
  .chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .swatch{width:26px;height:26px;padding:0;border-radius:5px}
  .swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--paper)}
  .field{display:flex;align-items:center;gap:9px}
  .field label{color:var(--mute);min-width:74px;font-weight:500}
  input[type=range]{flex:1;accent-color:var(--amber);height:18px}
  input[type=number]{
    font:inherit;width:62px;padding:5px 7px;border-radius:5px;
    border:1px solid var(--line);background:rgba(244,246,248,.06);color:var(--paper);
  }
  .val{color:var(--paper);min-width:46px;text-align:right;font-size:11px}
  .panel-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:2px}
  .hint{color:var(--mute);font-size:10px;line-height:1.5}
</style>
</head>
<body>

<div id="stage">
  <canvas id="cv"></canvas>

  <div id="ui">
    <button id="btn-main" class="pri">Start</button>
    <button id="btn-reset">Reset</button>
    <button id="btn-open" aria-label="Settings">Settings</button>
  </div>

  <div id="panel">
    <div class="row">
      <h2>Length</h2>
      <div class="chips" id="presets"></div>
    </div>

    <div class="row">
      <h2>Custom</h2>
      <div class="field">
        <label for="in-min">Minutes</label>
        <input type="number" id="in-min" min="0" max="180" step="1" value="5">
        <label for="in-sec" style="min-width:auto">Seconds</label>
        <input type="number" id="in-sec" min="0" max="59" step="1" value="0">
      </div>
    </div>

    <div class="row">
      <h2>Clock face</h2>
      <div class="chips" id="faces"></div>
    </div>

    <div class="row">
      <h2>Color</h2>
      <div class="chips" id="colors"></div>
    </div>

    <div class="row">
      <h2>Size</h2>
      <div class="field">
        <label for="in-scale">Text size</label>
        <input type="range" id="in-scale" min="40" max="180" step="5" value="100">
        <span class="val" id="v-scale">100%</span>
      </div>
    </div>

    <div class="row">
      <h2>Warn at</h2>
      <div class="field">
        <label for="in-warn">Seconds left</label>
        <input type="range" id="in-warn" min="0" max="180" step="5" value="60">
        <span class="val" id="v-warn">60s</span>
      </div>
    </div>

    <div class="row">
      <h2>Background</h2>
      <div class="chips" id="bgs"></div>
    </div>

    <div class="row">
      <h2>Drop shadow</h2>
      <div class="chips" id="shadows"></div>
    </div>

    <div class="row">
      <h2>At zero</h2>
      <div class="chips" id="ends"></div>
    </div>

    <div class="panel-foot">
      <p class="hint">Space pauses, R resets.<br>Click the timer once in a slideshow to use them.</p>
      <button id="btn-close" class="pri">Done</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var S = {
    duration: 300,
    face: 'digital',
    color: 'auto',
    scale: 100,
    warn: 60,
    bg: 'none',
    shadow: true,
    end: 'over'
  };

  var running = false, endAt = 0, left = S.duration;
  var raf = 0, lastShown = null, audioCtx = null, chimed = false;

  var el = function (id) { return document.getElementById(id); };
  var stage = el('stage'), ui = el('ui'), panel = el('panel'), cv = el('cv');
  var ctx = cv.getContext('2d');

  var W = 300, H = 200;

  var MONO = '"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace';
  var SANS = '"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  var PAPER = '#F4F6F8', AMBER = '#F2A93B', SIGNAL = '#E8483B';

  // ---------- persistence ----------

  var officeReady = false;

  function save() {
    var json = JSON.stringify(S);
    try { localStorage.setItem('classtimer', json); } catch (e) {}
    if (officeReady) {
      try {
        Office.context.document.settings.set('classtimer', json);
        Office.context.document.settings.saveAsync();
      } catch (e) {}
    }
  }

  function load() {
    var json = null;
    if (officeReady) {
      try { json = Office.context.document.settings.get('classtimer'); } catch (e) {}
    }
    if (!json) { try { json = localStorage.getItem('classtimer'); } catch (e) {} }
    if (!json) return;
    try {
      var saved = JSON.parse(json);
      for (var k in S) { if (saved[k] !== undefined) S[k] = saved[k]; }
    } catch (e) {}
  }

  // ---------- values ----------

  function activeColor() {
    if (S.color !== 'auto') return S.color;
    if (left <= 10) return SIGNAL;
    if (S.warn > 0 && left <= S.warn) return AMBER;
    return PAPER;
  }

  function clock(sec) {
    var neg = sec < 0, t = Math.abs(Math.ceil(sec));
    var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    var out = h > 0 ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s);
    return (neg ? '+' : '') + out;
  }

  function words(sec) {
    if (sec <= 0) {
      var o = Math.floor(-sec);
      if (o < 5) return "Time's up";
      return o < 60 ? o + ' seconds over' : Math.floor(o / 60) + ' minutes over';
    }
    var t = Math.ceil(sec);
    if (t <= 10) return t + (t === 1 ? ' second left' : ' seconds left');
    if (t < 60) return Math.floor(t / 5) * 5 + ' seconds left';
    if (t < 120) return 'About a minute left';
    return Math.floor(t / 60) + ' minutes left';
  }

  // ---------- canvas sizing ----------

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    W = Math.max(1, stage.clientWidth);
    H = Math.max(1, stage.clientHeight);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // Pick the largest font that fits both budgets. This measures, shrinks and
  // re-measures rather than trusting one calculation, so an engine that parses
  // the font shorthand differently still can't produce overflowing text.
  function fitSize(text, family, weight, maxW, maxH) {
    var size = maxH;
    for (var i = 0; i < 6; i++) {
      setFont(size, family, weight);
      var w = ctx.measureText(text).width;
      if (!w || w <= maxW) break;
      size = size * (maxW / w) * 0.99;
    }
    return Math.max(6, size);
  }

  // Set the font and confirm the engine actually accepted it. If a family list
  // is rejected the old font silently stays active, which is how text ends up
  // drawn at the previous face's size. Falling back to a generic keeps sizing honest.
  function setFont(px, family, weight) {
    var head = (weight || 600) + ' ' + px + 'px ';
    ctx.font = head + family;
    if (ctx.font.indexOf('px') === -1 || ctx.measureText('0').width < px * 0.15) {
      ctx.font = head + (family === MONO ? 'monospace' : 'sans-serif');
    }
  }

  function shadowOn() {
    if (!S.shadow) return;
    ctx.shadowColor = 'rgba(14,17,22,.45)';
    ctx.shadowBlur = Math.max(3, H * 0.03);
    ctx.shadowOffsetY = Math.max(1, H * 0.006);
  }
  function shadowOff() {
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
  }

  function polar(cx, cy, r, deg) {
    var a = (deg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }

  // ---------- faces ----------

  function drawDigital(txt, col, k) {
    var size = fitSize(txt, MONO, '600', W * 0.92, H * 0.82) * k;
    setFont(size, MONO, '600');
    ctx.fillStyle = col;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    shadowOn();
    ctx.fillText(txt, W / 2, H / 2);
    shadowOff();
  }

  function drawWords(txt, col, k) {
    var size = fitSize(txt, SANS, '600', W * 0.9, H * 0.44) * k;
    setFont(size, SANS, '600');
    ctx.fillStyle = col;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    shadowOn();
    ctx.fillText(txt, W / 2, H / 2);
    shadowOff();
  }

  function drawBar(txt, col, k, frac) {
    var size = fitSize(txt, MONO, '600', W * 0.86, H * 0.56) * k;
    setFont(size, MONO, '600');
    ctx.fillStyle = col;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    shadowOn();
    ctx.fillText(txt, W / 2, H * 0.40);
    shadowOff();

    var bh = Math.max(4, size * 0.16);
    var bw = W * 0.86, bx = (W - bw) / 2, by = H * 0.74;
    ctx.fillStyle = 'rgba(244,246,248,.16)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = col;
    ctx.fillRect(bx, by, bw * frac, bh);
  }

  function drawRing(txt, col, k, frac) {
    var R = Math.min(W, H) * 0.44;
    var cx = W / 2, cy = H / 2;
    var lw = Math.max(3, R * 0.16);

    ctx.lineWidth = lw;
    ctx.strokeStyle = 'rgba(244,246,248,.16)';
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.stroke();

    if (frac > 0) {
      ctx.strokeStyle = col;
      ctx.beginPath();
      ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
      ctx.stroke();
    }

    var inner = (R - lw) * 1.35;
    var size = fitSize(txt, MONO, '600', inner, inner * 0.5) * Math.min(1.35, k);
    setFont(size, MONO, '600');
    ctx.fillStyle = col;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, cx, cy);
  }

  function drawDial(col, frac) {
    var R = Math.min(W, H) * 0.46;
    var cx = W / 2, cy = H / 2;

    if (frac > 0) {
      ctx.fillStyle = col;
      ctx.globalAlpha = 0.16;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.lineWidth = Math.max(1, R * 0.016);
    ctx.strokeStyle = 'rgba(244,246,248,.16)';
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.stroke();

    for (var i = 0; i < 60; i++) {
      var major = i % 5 === 0;
      var a = polar(cx, cy, R, i * 6);
      var b = polar(cx, cy, R - (major ? R * 0.16 : R * 0.08), i * 6);
      ctx.beginPath();
      ctx.lineWidth = major ? Math.max(1.5, R * 0.028) : Math.max(1, R * 0.016);
      ctx.strokeStyle = major ? col : 'rgba(244,246,248,.16)';
      ctx.globalAlpha = major ? 0.7 : 1;
      ctx.lineCap = 'round';
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    var hp = polar(cx, cy, R * 0.86, 360 * frac);
    ctx.beginPath();
    ctx.lineWidth = Math.max(2, R * 0.034);
    ctx.strokeStyle = col;
    ctx.lineCap = 'round';
    ctx.moveTo(cx, cy);
    ctx.lineTo(hp[0], hp[1]);
    ctx.stroke();

    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(2, R * 0.034), 0, Math.PI * 2);
    ctx.fill();
  }

  // ---------- the single paint path ----------

  function paint(force) {
    var shown = Math.ceil(left);
    var urgent = running && left <= 10 && left > -1;
    if (!force && !urgent && shown === lastShown) return;
    lastShown = shown;

    // everything starts from a fully cleared surface — no stale pixels, ever
    ctx.clearRect(0, 0, W, H);

    var col = activeColor();
    var k = S.scale / 100;
    var frac = S.duration > 0 ? Math.max(0, Math.min(1, left / S.duration)) : 0;
    var txt = clock(left);

    if (urgent && !reduceMotion) {
      ctx.globalAlpha = (Math.floor(Date.now() / 500) % 2) ? 0.34 : 1;
    }

    if (S.face === 'digital') drawDigital(txt, col, k);
    else if (S.face === 'words') drawWords(words(left), col, k);
    else if (S.face === 'bar') drawBar(txt, col, k, frac);
    else if (S.face === 'ring') drawRing(txt, col, k, frac);
    else if (S.face === 'dial') drawDial(col, frac);

    ctx.globalAlpha = 1;
  }

  var reduceMotion = window.matchMedia
    ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;

  function tick() {
    if (!running) return;
    left = (endAt - Date.now()) / 1000;

    if (left <= 0 && !chimed) {
      chimed = true;
      if (S.end === 'chime') beep();
      if (S.end === 'stop') {
        left = 0;
        running = false;
        el('btn-main').textContent = 'Start';
        paint(true);
        return;
      }
    }
    paint(false);
    raf = requestAnimationFrame(tick);
  }

  function beep() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.22, 0.44].forEach(function (offset) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        var t = audioCtx.currentTime + offset;
        o.type = 'sine';
        o.frequency.setValueAtTime(880, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.28, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 0.2);
      });
    } catch (e) {}
  }

  // ---------- transport ----------

  function start() {
    if (left <= 0 && S.end !== 'over') left = S.duration;
    endAt = Date.now() + left * 1000;
    running = true;
    chimed = left <= 0;
    el('btn-main').textContent = 'Pause';
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  function pause() {
    running = false;
    cancelAnimationFrame(raf);
    left = (endAt - Date.now()) / 1000;
    el('btn-main').textContent = 'Resume';
    paint(true);
  }

  function reset() {
    running = false;
    cancelAnimationFrame(raf);
    chimed = false;
    left = S.duration;
    el('btn-main').textContent = 'Start';
    paint(true);
  }

  el('btn-main').onclick = function () { running ? pause() : start(); };
  el('btn-reset').onclick = reset;

  // ---------- reveal on movement ----------

  var idleTimer = 0;

  function reveal() {
    ui.classList.add('show');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      if (!panel.classList.contains('show')) ui.classList.remove('show');
    }, 2500);
  }

  ['pointermove', 'pointerdown', 'pointerenter'].forEach(function (ev) {
    document.addEventListener(ev, reveal, { passive: true });
  });
  document.addEventListener('pointerleave', function () {
    if (!panel.classList.contains('show')) ui.classList.remove('show');
  });

  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); running ? pause() : start(); reveal(); }
    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); reset(); reveal(); }
  });

  // ---------- settings panel ----------

  function chipSet(host, items, get, set) {
    host.innerHTML = '';
    items.forEach(function (it) {
      var b = document.createElement('button');
      b.className = 'chip' + (it.swatch ? ' swatch' : '');
      b.type = 'button';
      if (it.swatch) { b.style.background = it.swatch; b.setAttribute('aria-label', it.label); }
      else { b.textContent = it.label; }
      b.setAttribute('aria-pressed', String(get() === it.value));
      b.onclick = function () {
        set(it.value);
        Array.prototype.forEach.call(host.children, function (c, i) {
          c.setAttribute('aria-pressed', String(items[i].value === it.value));
        });
        save();
      };
      host.appendChild(b);
    });
  }

  var PRESETS = [1, 2, 3, 5, 10, 15, 20, 30];
  var FACES = ['digital', 'dial', 'ring', 'bar', 'words'];
  var COLORS = ['auto', '#F4F6F8', '#12161C', '#F2A93B', '#E8483B', '#4FC98A', '#4C9BE8'];
  var BGS = ['none', 'veil', 'solid'];
  var ENDS = ['stop', 'over', 'chime'];

  chipSet(el('presets'),
    PRESETS.map(function (m) { return { label: m + ' min', value: m * 60 }; }),
    function () { return S.duration; },
    function (v) {
      S.duration = v;
      el('in-min').value = Math.floor(v / 60);
      el('in-sec').value = v % 60;
      reset();
    });

  chipSet(el('faces'),
    [{ label: 'Digital', value: 'digital' }, { label: 'Dial', value: 'dial' },
     { label: 'Ring', value: 'ring' }, { label: 'Bar', value: 'bar' },
     { label: 'Words', value: 'words' }],
    function () { return S.face; },
    function (v) { S.face = v; paint(true); });

  chipSet(el('colors'),
    [{ label: 'Auto', value: 'auto' },
     { label: 'White', value: '#F4F6F8', swatch: '#F4F6F8' },
     { label: 'Black', value: '#12161C', swatch: '#12161C' },
     { label: 'Amber', value: '#F2A93B', swatch: '#F2A93B' },
     { label: 'Red', value: '#E8483B', swatch: '#E8483B' },
     { label: 'Green', value: '#4FC98A', swatch: '#4FC98A' },
     { label: 'Blue', value: '#4C9BE8', swatch: '#4C9BE8' }],
    function () { return S.color; },
    function (v) { S.color = v; paint(true); });

  chipSet(el('bgs'),
    [{ label: 'Clear', value: 'none' }, { label: 'Dark veil', value: 'veil' },
     { label: 'Solid', value: 'solid' }],
    function () { return S.bg; },
    function (v) {
      S.bg = v;
      stage.classList.toggle('bg-veil', v === 'veil');
      stage.classList.toggle('bg-solid', v === 'solid');
    });

  chipSet(el('shadows'),
    [{ label: 'On', value: true }, { label: 'Off', value: false }],
    function () { return S.shadow; },
    function (v) { S.shadow = v; });

  chipSet(el('ends'),
    [{ label: 'Stop at zero', value: 'stop' }, { label: 'Count overtime', value: 'over' },
     { label: 'Overtime + chime', value: 'chime' }],
    function () { return S.end; },
    function (v) { S.end = v; });

  function customDuration() {
    var m = Math.max(0, Math.min(180, parseInt(el('in-min').value, 10) || 0));
    var s = Math.max(0, Math.min(59, parseInt(el('in-sec').value, 10) || 0));
    S.duration = Math.max(1, m * 60 + s);
    Array.prototype.forEach.call(el('presets').children, function (c, i) {
      c.setAttribute('aria-pressed', String(PRESETS[i] * 60 === S.duration));
    });
    reset();
    save();
  }
  el('in-min').onchange = customDuration;
  el('in-sec').onchange = customDuration;

  el('in-scale').oninput = function () {
    S.scale = +this.value;
    el('v-scale').textContent = S.scale + '%';
    paint(true);
  };
  el('in-scale').onchange = save;

  el('in-warn').oninput = function () {
    S.warn = +this.value;
    el('v-warn').textContent = S.warn === 0 ? 'off' : S.warn + 's';
    paint(true);
  };
  el('in-warn').onchange = save;

  el('btn-open').onclick = function () { panel.classList.add('show'); ui.classList.add('show'); };
  el('btn-close').onclick = function () { panel.classList.remove('show'); save(); reveal(); };

  // ---------- boot ----------

  function boot() {
    load();
    el('in-min').value = Math.floor(S.duration / 60);
    el('in-sec').value = S.duration % 60;
    el('in-scale').value = S.scale;
    el('v-scale').textContent = S.scale + '%';
    el('in-warn').value = S.warn;
    el('v-warn').textContent = S.warn === 0 ? 'off' : S.warn + 's';
    stage.classList.toggle('bg-veil', S.bg === 'veil');
    stage.classList.toggle('bg-solid', S.bg === 'solid');

    var mark = function (id, list, cur) {
      Array.prototype.forEach.call(el(id).children, function (c, i) {
        c.setAttribute('aria-pressed', String(list[i] === cur));
      });
    };
    mark('presets', PRESETS.map(function (m) { return m * 60; }), S.duration);
    mark('faces', FACES, S.face);
    mark('colors', COLORS, S.color);
    mark('bgs', BGS, S.bg);
    mark('shadows', [true, false], S.shadow);
    mark('ends', ENDS, S.end);

    left = S.duration;
    resize();
    paint(true);
    reveal();
  }

  function onResize() { resize(); paint(true); }
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(stage);
  else window.addEventListener('resize', onResize);

  if (typeof Office !== 'undefined' && Office.onReady) {
    Office.onReady(function () { officeReady = true; boot(); });
  } else {
    boot();
  }
})();
</script>
