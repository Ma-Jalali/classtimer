<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Timer</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root{
    --ink:#0E1116;
    --paper:#F4F6F8;
    --amber:#F2A93B;
    --signal:#E8483B;
    --mute:#8A94A3;
    --line:rgba(244,246,248,.16);
    --sh:0 2px 0 rgba(14,17,22,.55);
    --face:var(--paper);
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --num:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%;overflow:hidden}

  body{
    font-family:var(--ui);
    background:transparent;
    color:var(--paper);
    -webkit-font-smoothing:antialiased;
    user-select:none;
    cursor:default;
  }

  #stage{
    position:relative;
    /* A near-invisible fill. PowerPoint's WebView leaves stale pixels behind
       when it has nothing opaque to clear a repaint region with. */
    background:rgba(255,255,255,.004);
    transform:translateZ(0);
    will-change:transform;
    height:100%;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2.5%;
    transition:background-color .2s ease;
  }
  #stage.bg-veil{background:rgba(14,17,22,.55)}
  #stage.bg-solid{background:var(--ink)}

  /* ---------- faces ---------- */

  .face{display:none;width:100%;height:100%;align-items:center;justify-content:center}
  .face.on{display:flex}

  #f-digital span{
    will-change:contents;
    transform:translateZ(0);
    backface-visibility:hidden;
    font-family:var(--num);
    font-weight:600;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;
    line-height:1;
    color:var(--face);
    text-shadow:var(--sh);
    transition:color .5s linear;
  }

  #f-words span{
    will-change:contents;
    transform:translateZ(0);
    backface-visibility:hidden;
    font-weight:600;
    line-height:1.1;
    text-align:center;
    color:var(--face);
    text-shadow:var(--sh);
    transition:color .5s linear;
    padding:0 .3em;
  }

  #f-bar{flex-direction:column;gap:.5em}
  #f-bar .num{
    will-change:contents;
    transform:translateZ(0);
    backface-visibility:hidden;
    font-family:var(--num);
    font-weight:600;
    font-variant-numeric:tabular-nums;
    line-height:1;
    color:var(--face);
    text-shadow:var(--sh);
    transition:color .5s linear;
  }
  #f-bar .track{
    width:100%;
    background:var(--line);
    overflow:hidden;
    border-radius:2px;
  }
  #f-bar .fill{
    height:100%;
    width:100%;
    background:var(--face);
    transform-origin:left center;
    transition:background-color .5s linear;
  }

  svg{display:block;width:100%;height:100%;overflow:visible}
  .ringtrack{stroke:var(--line);fill:none}
  .ringfill{stroke:var(--face);fill:none;stroke-linecap:butt;transition:stroke .5s linear}
  .ringnum{
    will-change:contents;
    transform:translateZ(0);
    backface-visibility:hidden;
    font-family:var(--num);
    font-weight:600;
    font-variant-numeric:tabular-nums;
    fill:var(--face);
    text-anchor:middle;
    dominant-baseline:central;
    transition:fill .5s linear;
  }
  .dialring{stroke:var(--line);fill:none;stroke-width:1.5}
  .dialtick{stroke:var(--line);stroke-width:1.5;stroke-linecap:round}
  .dialtick.major{stroke:var(--face);stroke-width:2.5;opacity:.7;transition:stroke .5s linear}
  .dialwedge{fill:var(--face);opacity:.16;transition:fill .5s linear}
  .dialhand{stroke:var(--face);stroke-width:3;stroke-linecap:round;transition:stroke .5s linear}
  .dialpin{fill:var(--face);transition:fill .5s linear}

  /* the last-stretch heartbeat — one signature move, nothing else animates */
  @keyframes beat{
    0%,100%{opacity:1}
    50%{opacity:.34}
  }
  #stage.urgent .face{animation:beat 1s steps(1,end) infinite}
  @media (prefers-reduced-motion:reduce){
    #stage.urgent .face{animation:none}
  }

  /* ---------- controls: hidden until the mouse moves ---------- */

  #ui{
    position:absolute;
    inset:auto 0 0 0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:8px;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .18s ease,transform .18s ease;
    pointer-events:none;
  }
  #ui.show{opacity:1;transform:none;pointer-events:auto}

  button{
    font:inherit;
    font-size:12px;
    font-weight:600;
    color:var(--paper);
    background:rgba(14,17,22,.82);
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 11px;
    cursor:pointer;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    white-space:nowrap;
    transition:background-color .12s ease;
  }
  button:hover{background:rgba(38,44,54,.92)}
  button:active{background:rgba(58,66,80,.95)}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  button.pri{background:rgba(242,169,59,.92);color:#171208;border-color:transparent}
  button.pri:hover{background:rgba(247,182,84,.96)}

  /* ---------- settings panel ---------- */

  #panel{
    position:absolute;
    inset:0;
    background:rgba(14,17,22,.96);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding:14px;
    overflow-y:auto;
    display:none;
    font-size:12px;
  }
  #panel.show{display:block}
  #panel h2{
    font-size:10px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--mute);
    margin:0 0 7px;
  }
  .row{margin-bottom:14px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{
    font-size:11px;
    font-weight:600;
    padding:5px 9px;
    border-radius:5px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--mute);
    cursor:pointer;
  }
  .chip:hover{color:var(--paper);border-color:rgba(244,246,248,.35)}
  .chip[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:transparent}
  .chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .swatch{width:26px;height:26px;padding:0;border-radius:5px}
  .swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--paper)}
  .field{display:flex;align-items:center;gap:9px}
  .field label{color:var(--mute);min-width:74px;font-weight:500}
  input[type=range]{flex:1;accent-color:var(--amber);height:18px}
  input[type=number]{
    font:inherit;width:62px;padding:5px 7px;border-radius:5px;
    border:1px solid var(--line);background:rgba(244,246,248,.06);color:var(--paper);
  }
  input[type=color]{
    width:26px;height:26px;padding:0;border:1px solid var(--line);
    border-radius:5px;background:transparent;cursor:pointer;
  }
  .val{font-family:var(--num);color:var(--paper);min-width:46px;text-align:right;font-size:11px}
  .panel-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:2px}
  .hint{color:var(--mute);font-size:10px;line-height:1.5}
</style>
</head>
<body>

<div id="stage">

  <div class="face on" id="f-digital"><span id="d-text">05:00</span></div>

  <div class="face" id="f-words"><span id="w-text">5 minutes left</span></div>

  <div class="face" id="f-bar">
    <div class="num" id="b-text">05:00</div>
    <div class="track" id="b-track"><div class="fill" id="b-fill"></div></div>
  </div>

  <div class="face" id="f-ring">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ringtrack" cx="50" cy="50" r="43" stroke-width="7"/>
      <circle class="ringfill" id="r-arc" cx="50" cy="50" r="43" stroke-width="7"
              transform="rotate(-90 50 50)"/>
      <text class="ringnum" id="r-text" x="50" y="51" font-size="21">05:00</text>
    </svg>
  </div>

  <div class="face" id="f-dial">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path class="dialwedge" id="k-wedge"></path>
      <circle class="dialring" cx="50" cy="50" r="44"/>
      <g id="k-ticks"></g>
      <line class="dialhand" id="k-hand" x1="50" y1="50" x2="50" y2="12"/>
      <circle class="dialpin" cx="50" cy="50" r="3"/>
    </svg>
  </div>

  <div id="ui">
    <button id="btn-main" class="pri">Start</button>
    <button id="btn-reset">Reset</button>
    <button id="btn-open" aria-label="Settings">Settings</button>
  </div>

  <div id="panel">
    <div class="row">
      <h2>Length</h2>
      <div class="chips" id="presets"></div>
    </div>

    <div class="row">
      <h2>Custom</h2>
      <div class="field">
        <label for="in-min">Minutes</label>
        <input type="number" id="in-min" min="0" max="180" step="1" value="5">
        <label for="in-sec" style="min-width:auto">Seconds</label>
        <input type="number" id="in-sec" min="0" max="59" step="1" value="0">
      </div>
    </div>

    <div class="row">
      <h2>Clock face</h2>
      <div class="chips" id="faces"></div>
    </div>

    <div class="row">
      <h2>Color</h2>
      <div class="chips" id="colors"></div>
    </div>

    <div class="row">
      <h2>Size</h2>
      <div class="field">
        <label for="in-scale">Text size</label>
        <input type="range" id="in-scale" min="40" max="180" step="5" value="100">
        <span class="val" id="v-scale">100%</span>
      </div>
    </div>

    <div class="row">
      <h2>Warn at</h2>
      <div class="field">
        <label for="in-warn">Seconds left</label>
        <input type="range" id="in-warn" min="0" max="180" step="5" value="60">
        <span class="val" id="v-warn">60s</span>
      </div>
    </div>

    <div class="row">
      <h2>Background</h2>
      <div class="chips" id="bgs"></div>
    </div>

    <div class="row">
      <h2>Drop shadow</h2>
      <div class="chips" id="shadows"></div>
    </div>

    <div class="row">
      <h2>At zero</h2>
      <div class="chips" id="ends"></div>
    </div>

    <div class="panel-foot">
      <p class="hint">Space pauses, R resets.<br>Click the timer once in a slideshow to use them.</p>
      <button id="btn-close" class="pri">Done</button>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ---------- state ----------

  var S = {
    duration: 300,      // seconds
    face: 'digital',
    color: 'auto',      // 'auto' | hex
    scale: 100,
    warn: 60,           // seconds left when the warning color kicks in
    bg: 'none',         // none | veil | solid
    end: 'over',         // stop | over | chime
    shadow: true
  };

  var running = false;
  var endAt = 0;        // ms timestamp the countdown ends
  var left = S.duration; // seconds remaining (may go negative in overtime)
  var raf = 0;
  var lastPaint = null;
  var audioCtx = null;
  var chimed = false;

  var el = function (id) { return document.getElementById(id); };

  var stage = el('stage'), ui = el('ui'), panel = el('panel');
  var faces = {
    digital: el('f-digital'),
    words: el('f-words'),
    bar: el('f-bar'),
    ring: el('f-ring'),
    dial: el('f-dial')
  };

  // ---------- persistence ----------

  var officeReady = false;

  function save() {
    var json = JSON.stringify(S);
    try { localStorage.setItem('classtimer', json); } catch (e) {}
    if (officeReady) {
      try {
        Office.context.document.settings.set('classtimer', json);
        Office.context.document.settings.saveAsync();
      } catch (e) {}
    }
  }

  function load() {
    var json = null;
    if (officeReady) {
      try { json = Office.context.document.settings.get('classtimer'); } catch (e) {}
    }
    if (!json) {
      try { json = localStorage.getItem('classtimer'); } catch (e) {}
    }
    if (!json) return;
    try {
      var saved = JSON.parse(json);
      for (var k in S) { if (saved[k] !== undefined) S[k] = saved[k]; }
    } catch (e) {}
  }

  // ---------- color ----------

  var PAPER = '#F4F6F8', AMBER = '#F2A93B', SIGNAL = '#E8483B';

  function activeColor() {
    if (S.color !== 'auto') return S.color;
    if (left <= 0) return SIGNAL;
    if (left <= 10) return SIGNAL;
    if (S.warn > 0 && left <= S.warn) return AMBER;
    return PAPER;
  }

  // ---------- formatting ----------

  function clock(sec) {
    var neg = sec < 0;
    var t = Math.abs(Math.ceil(sec));
    var h = Math.floor(t / 3600);
    var m = Math.floor((t % 3600) / 60);
    var s = t % 60;
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    var out = h > 0 ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s);
    return (neg ? '+' : '') + out;
  }

  function words(sec) {
    if (sec <= 0) {
      var over = Math.floor(-sec);
      if (over < 5) return "Time's up";
      return over < 60 ? over + ' seconds over' : Math.floor(over / 60) + ' minutes over';
    }
    var t = Math.ceil(sec);
    if (t <= 10) return t + (t === 1 ? ' second left' : ' seconds left');
    if (t < 60) return Math.floor(t / 5) * 5 + ' seconds left';
    if (t < 120) return 'About a minute left';
    return Math.floor(t / 60) + ' minutes left';
  }

  // ---------- fitting text to the box ----------

  var box = { w: 300, h: 200 };

  function fit() {
    box.w = stage.clientWidth * 0.95;
    box.h = stage.clientHeight * 0.95;
    var k = S.scale / 100;

    // digital: width-driven so long values never clip
    var chars = clock(S.duration).length + (S.end === 'stop' ? 0 : 1);
    var byW = box.w / (chars * 0.62);
    var size = Math.max(10, Math.min(byW, box.h) * k);
    el('d-text').style.fontSize = size + 'px';

    el('w-text').style.fontSize =
      Math.max(9, Math.min(box.w / 11, box.h / 2.6) * k) + 'px';

    var bn = Math.max(10, Math.min(box.w / (chars * 0.7), box.h * 0.62) * k);
    el('b-text').style.fontSize = bn + 'px';
    el('b-track').style.height = Math.max(5, bn * 0.16) + 'px';

    var sq = Math.max(40, Math.min(box.w, box.h));
    faces.ring.querySelector('svg').style.width = sq + 'px';
    faces.ring.querySelector('svg').style.height = sq + 'px';
    faces.dial.querySelector('svg').style.width = sq + 'px';
    faces.dial.querySelector('svg').style.height = sq + 'px';
    el('r-text').setAttribute('font-size', String(21 * Math.min(1.35, k)));
  }

  // ---------- dial geometry ----------

  function polar(cx, cy, r, deg) {
    var a = (deg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }

  function wedgePath(frac) {
    if (frac <= 0) return '';
    if (frac >= 1) frac = 0.9999;
    var deg = 360 * frac;
    var p = polar(50, 50, 44, deg);
    var big = deg > 180 ? 1 : 0;
    return 'M50,50 L50,6 A44,44 0 ' + big + ' 1 ' +
           p[0].toFixed(2) + ',' + p[1].toFixed(2) + ' Z';
  }

  (function buildTicks() {
    var g = el('k-ticks'), out = '';
    for (var i = 0; i < 60; i++) {
      var major = i % 5 === 0;
      var a = polar(50, 50, 44, i * 6);
      var b = polar(50, 50, major ? 37 : 40.5, i * 6);
      out += '<line class="dialtick' + (major ? ' major' : '') + '" x1="' +
             a[0].toFixed(2) + '" y1="' + a[1].toFixed(2) + '" x2="' +
             b[0].toFixed(2) + '" y2="' + b[1].toFixed(2) + '"/>';
    }
    g.innerHTML = out;
  })();

  var RING_C = 2 * Math.PI * 43;
  el('r-arc').setAttribute('stroke-dasharray', RING_C.toFixed(2));

  // ---------- painting ----------

  // PowerPoint's WebView sometimes miscalculates which pixels changed and leaves
  // the old digits on screen. Detaching the node and putting it back forces a
  // real layout and repaint of that region. At one update per second this is free.
  function setText(node, str) {
    if (node.textContent === str) return;
    var parent = node.parentNode;
    if (!parent) { node.textContent = str; return; }
    var next = node.nextSibling;
    parent.removeChild(node);
    node.textContent = str;
    parent.insertBefore(node, next);
  }

  function paint(force) {
    var shown = Math.ceil(left);
    if (!force && shown === lastPaint) return;
    lastPaint = shown;

    var col = activeColor();
    stage.style.setProperty('--face', col);

    var frac = S.duration > 0 ? Math.max(0, Math.min(1, left / S.duration)) : 0;
    var txt = clock(left);

    if (S.face === 'digital') {
      setText(el('d-text'), txt);
    } else if (S.face === 'words') {
      setText(el('w-text'), words(left));
    } else if (S.face === 'bar') {
      setText(el('b-text'), txt);
      el('b-fill').style.transform = 'scaleX(' + frac.toFixed(4) + ')';
    } else if (S.face === 'ring') {
      setText(el('r-text'), txt);
      el('r-arc').setAttribute('stroke-dashoffset', (RING_C * (1 - frac)).toFixed(2));
    } else if (S.face === 'dial') {
      el('k-wedge').setAttribute('d', wedgePath(frac));
      var p = polar(50, 50, 38, 360 * frac);
      el('k-hand').setAttribute('x2', p[0].toFixed(2));
      el('k-hand').setAttribute('y2', p[1].toFixed(2));
    }

    var urgent = running && left <= 10 && left > -1;
    stage.classList.toggle('urgent', urgent);
  }

  function tick() {
    if (!running) return;
    left = (endAt - Date.now()) / 1000;

    if (left <= 0 && !chimed) {
      chimed = true;
      if (S.end === 'chime') beep();
      if (S.end === 'stop') {
        left = 0;
        running = false;
        el('btn-main').textContent = 'Start';
        paint(true);
        return;
      }
    }
    paint(false);
    raf = requestAnimationFrame(tick);
  }

  // ---------- sound (generated, so nothing loads) ----------

  function beep() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.22, 0.44].forEach(function (offset) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        var t = audioCtx.currentTime + offset;
        o.type = 'sine';
        o.frequency.setValueAtTime(880, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.28, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 0.2);
      });
    } catch (e) {}
  }

  // ---------- transport ----------

  function start() {
    if (left <= 0 && S.end !== 'over') left = S.duration;
    endAt = Date.now() + left * 1000;
    running = true;
    chimed = left <= 0;
    el('btn-main').textContent = 'Pause';
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  function pause() {
    running = false;
    cancelAnimationFrame(raf);
    left = (endAt - Date.now()) / 1000;
    el('btn-main').textContent = 'Resume';
    stage.classList.remove('urgent');
    paint(true);
  }

  function reset() {
    running = false;
    cancelAnimationFrame(raf);
    chimed = false;
    left = S.duration;
    el('btn-main').textContent = 'Start';
    stage.classList.remove('urgent');
    fit();
    paint(true);
  }

  el('btn-main').onclick = function () { running ? pause() : start(); };
  el('btn-reset').onclick = reset;

  // ---------- reveal on movement ----------

  var hideAt = 0, idleTimer = 0;

  function reveal() {
    ui.classList.add('show');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      if (!panel.classList.contains('show')) ui.classList.remove('show');
    }, 2500);
  }

  ['pointermove', 'pointerdown', 'pointerenter'].forEach(function (ev) {
    document.addEventListener(ev, reveal, { passive: true });
  });
  document.addEventListener('pointerleave', function () {
    if (!panel.classList.contains('show')) ui.classList.remove('show');
  });

  // (removed: a capture-phase stopPropagation here blocked every button click.
  //  Not needed — the add-in runs in its own frame, so clicks don't reach the slide.)

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); running ? pause() : start(); reveal(); }
    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); reset(); reveal(); }
  });

  // ---------- settings panel ----------

  function chipSet(host, items, get, set) {
    host.innerHTML = '';
    items.forEach(function (it) {
      var b = document.createElement('button');
      b.className = 'chip' + (it.swatch ? ' swatch' : '');
      b.type = 'button';
      if (it.swatch) {
        b.style.background = it.swatch;
        b.setAttribute('aria-label', it.label);
      } else {
        b.textContent = it.label;
      }
      b.setAttribute('aria-pressed', String(get() === it.value));
      b.onclick = function () {
        set(it.value);
        Array.prototype.forEach.call(host.children, function (c, i) {
          c.setAttribute('aria-pressed', String(items[i].value === it.value));
        });
        save();
      };
      host.appendChild(b);
    });
  }

  function showFace() {
    for (var k in faces) faces[k].classList.toggle('on', k === S.face);
    fit();
    paint(true);
  }

  chipSet(el('presets'),
    [1, 2, 3, 5, 10, 15, 20, 30].map(function (m) {
      return { label: m + ' min', value: m * 60 };
    }),
    function () { return S.duration; },
    function (v) {
      S.duration = v;
      el('in-min').value = Math.floor(v / 60);
      el('in-sec').value = v % 60;
      reset();
    });

  chipSet(el('faces'),
    [{ label: 'Digital', value: 'digital' },
     { label: 'Dial', value: 'dial' },
     { label: 'Ring', value: 'ring' },
     { label: 'Bar', value: 'bar' },
     { label: 'Words', value: 'words' }],
    function () { return S.face; },
    function (v) { S.face = v; showFace(); });

  chipSet(el('colors'),
    [{ label: 'Auto', value: 'auto' },
     { label: 'White', value: '#F4F6F8', swatch: '#F4F6F8' },
     { label: 'Black', value: '#12161C', swatch: '#12161C' },
     { label: 'Amber', value: '#F2A93B', swatch: '#F2A93B' },
     { label: 'Red', value: '#E8483B', swatch: '#E8483B' },
     { label: 'Green', value: '#4FC98A', swatch: '#4FC98A' },
     { label: 'Blue', value: '#4C9BE8', swatch: '#4C9BE8' }],
    function () { return S.color; },
    function (v) { S.color = v; paint(true); });

  chipSet(el('bgs'),
    [{ label: 'Clear', value: 'none' },
     { label: 'Dark veil', value: 'veil' },
     { label: 'Solid', value: 'solid' }],
    function () { return S.bg; },
    function (v) {
      S.bg = v;
      stage.classList.toggle('bg-veil', v === 'veil');
      stage.classList.toggle('bg-solid', v === 'solid');
    });

  function applyShadow() {
    stage.style.setProperty('--sh', S.shadow ? '0 2px 0 rgba(14,17,22,.55)' : 'none');
  }

  chipSet(el('shadows'),
    [{ label: 'On', value: true },
     { label: 'Off', value: false }],
    function () { return S.shadow; },
    function (v) { S.shadow = v; applyShadow(); });

  chipSet(el('ends'),
    [{ label: 'Stop at zero', value: 'stop' },
     { label: 'Count overtime', value: 'over' },
     { label: 'Overtime + chime', value: 'chime' }],
    function () { return S.end; },
    function (v) { S.end = v; });

  function customDuration() {
    var m = Math.max(0, Math.min(180, parseInt(el('in-min').value, 10) || 0));
    var s = Math.max(0, Math.min(59, parseInt(el('in-sec').value, 10) || 0));
    S.duration = Math.max(1, m * 60 + s);
    Array.prototype.forEach.call(el('presets').children, function (c) {
      c.setAttribute('aria-pressed', 'false');
    });
    reset();
    save();
  }
  el('in-min').onchange = customDuration;
  el('in-sec').onchange = customDuration;

  el('in-scale').oninput = function () {
    S.scale = +this.value;
    el('v-scale').textContent = S.scale + '%';
    fit();
  };
  el('in-scale').onchange = save;

  el('in-warn').oninput = function () {
    S.warn = +this.value;
    el('v-warn').textContent = S.warn === 0 ? 'off' : S.warn + 's';
    paint(true);
  };
  el('in-warn').onchange = save;

  el('btn-open').onclick = function () { panel.classList.add('show'); ui.classList.add('show'); };
  el('btn-close').onclick = function () { panel.classList.remove('show'); save(); reveal(); };

  // ---------- boot ----------

  function boot() {
    load();
    el('in-min').value = Math.floor(S.duration / 60);
    el('in-sec').value = S.duration % 60;
    el('in-scale').value = S.scale;
    el('v-scale').textContent = S.scale + '%';
    el('in-warn').value = S.warn;
    el('v-warn').textContent = S.warn === 0 ? 'off' : S.warn + 's';
    stage.classList.toggle('bg-veil', S.bg === 'veil');
    stage.classList.toggle('bg-solid', S.bg === 'solid');
    applyShadow();

    ['presets', 'faces', 'colors', 'bgs', 'shadows', 'ends'].forEach(function (id) {
      var host = el(id);
      Array.prototype.forEach.call(host.children, function (c) {
        c.setAttribute('aria-pressed', 'false');
      });
    });
    // re-mark the saved selections
    var mark = function (id, matches) {
      Array.prototype.forEach.call(el(id).children, function (c, i) {
        c.setAttribute('aria-pressed', String(matches(i)));
      });
    };
    var presetVals = [1, 2, 3, 5, 10, 15, 20, 30].map(function (m) { return m * 60; });
    mark('presets', function (i) { return presetVals[i] === S.duration; });
    mark('faces', function (i) {
      return ['digital', 'dial', 'ring', 'bar', 'words'][i] === S.face;
    });
    mark('colors', function (i) {
      return ['auto', '#F4F6F8', '#12161C', '#F2A93B', '#E8483B', '#4FC98A', '#4C9BE8'][i] === S.color;
    });
    mark('bgs', function (i) { return ['none', 'veil', 'solid'][i] === S.bg; });
    mark('shadows', function (i) { return [true, false][i] === S.shadow; });
    mark('ends', function (i) { return ['stop', 'over', 'chime'][i] === S.end; });

    left = S.duration;
    showFace();
    reveal();
  }

  if (window.ResizeObserver) {
    new ResizeObserver(function () { fit(); paint(true); }).observe(stage);
  } else {
    window.addEventListener('resize', function () { fit(); paint(true); });
  }

  if (typeof Office !== 'undefined' && Office.onReady) {
    Office.onReady(function () { officeReady = true; boot(); });
  } else {
    boot();
  }
})();
</script>
</body>
</html>
